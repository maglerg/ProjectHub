version: "3.9"

services:
  # ═══════════════════════════════════════════════════════════
  #  База данных PostgreSQL
  # ═══════════════════════════════════════════════════════════
  db:
    image: postgres:16-alpine
    container_name: projecthub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: projecthub
      POSTGRES_USER: projecthub
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projecthub -d projecthub"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - projecthub-network

  # ═══════════════════════════════════════════════════════════
  #  Backend (.NET API)
  # ═══════════════════════════════════════════════════════════
  api:
    build:
      context: ./ProjectHub.API
      dockerfile: Dockerfile
    container_name: projecthub-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=projecthub;Username=projecthub;Password=${DB_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__ExpiryDays: "3"
    volumes:
      - uploads:/app/App_Data/uploads
    ports:
      - "8080:8080"
    networks:
      - projecthub-network

  # ═══════════════════════════════════════════════════════════
  #  Frontend (React + Nginx)
  # ═══════════════════════════════════════════════════════════
  client:
    build:
      context: ./projecthub.client
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
        REACT_APP_HUB_URL: /hubs/chat
    container_name: projecthub-client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"
    networks:
      - projecthub-network

# ═══════════════════════════════════════════════════════════
#  Volumes — постоянные хранилища данных
# ═══════════════════════════════════════════════════════════
volumes:
  pgdata:
    driver: local
  uploads:
    driver: local

# ═══════════════════════════════════════════════════════════
#  Networks — внутренняя сеть Docker
# ═══════════════════════════════════════════════════════════
networks:
  projecthub-network:
    driver: bridge