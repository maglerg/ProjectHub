services:
  # --- БАЗА ДАННЫХ ---
  db:
    image: postgres:16-alpine
    container_name: projecthub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: projecthub
      POSTGRES_USER: projecthub
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projecthub -d projecthub"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - projecthub-network

  # --- БЭКЕНД (.NET API) ---
  api:
    build:
      context: ./ProjectHub.API
      dockerfile: Dockerfile
    image: projecthub-api:1.0.0
    container_name: projecthub-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=projecthub;Username=projecthub;Password=${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
      Jwt__ExpiryDays: "3"
    volumes:
      - uploads:/app/App_Data/uploads
    expose:
      - "8080" # Внутренний порт, наружу не пробрасываем (доступ только через Nginx)
    networks:
      - projecthub-network

  # --- ФРОНТЕНД (React + Nginx) ---
  client:
    build:
      context: ./ProjectHub.Client
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
        REACT_APP_HUB_URL: /hubs/chat
    image: projecthub-client:1.0.0
    container_name: projecthub-client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Доступ к фронтенду. Если вы локально - можно открыть просто "3000:80".
      # Если на сервере - лучше "127.0.0.1:3000:80" (как у вас) и пустить через Caddy.
      - "3000:80" 
    networks:
      - projecthub-network

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local

networks:
  projecthub-network:
    driver: bridge